<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DealFinder{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827;margin:0}
  .card{background:#fff;border-radius:.75rem;box-shadow:0 1px 2px rgba(0,0,0,.06);padding:1rem}
  .btn{display:inline-block;border-radius:.5rem;padding:.5rem .9rem;font-weight:600;font-size:.875rem;cursor:pointer;border:0}
  .btn-primary{background:#4f46e5;color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-grey{background:#e5e7eb;color:#111}.btn-red{background:#dc2626;color:#fff}.btn-amber{background:#d97706;color:#fff}
  .pill{display:inline-block;border-radius:999px;padding:.1rem .55rem;font-size:.75rem;font-weight:600}
  .pill-green{background:#dcfce7;color:#166534}.pill-amber{background:#fef3c7;color:#92400e}.pill-red{background:#fee2e2;color:#991b1b}.pill-grey{background:#e5e7eb;color:#374151}.pill-blue{background:#dbeafe;color:#1e40af}
  input,select,textarea{border:1px solid #d1d5db;border-radius:.5rem;padding:.45rem .6rem;font-size:.9rem;width:100%}
  table{width:100%;border-collapse:collapse;font-size:.85rem}th{text-align:left;color:#6b7280;font-weight:600;padding:.4rem .3rem;border-bottom:1px solid #e5e7eb}td{padding:.45rem .3rem;border-bottom:1px solid #f3f4f6;vertical-align:top}
  nav a{color:#374151;text-decoration:none;font-size:.8rem;padding:.4rem .5rem;border-radius:.5rem;white-space:nowrap}nav a.active,nav a:hover{background:#e0e7ff;color:#3730a3}
  .kanban{display:flex;gap:.75rem;overflow-x:auto;padding-bottom:.5rem}.kanban>div{min-width:230px;flex:0 0 230px}
  /* offline fallback for the Tailwind utilities used in the templates (CDN unreachable => still looks right) */
  .flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.items-start{align-items:flex-start}.items-end{align-items:flex-end}
  .justify-between{justify-content:space-between}.ml-auto{margin-left:auto}.flex-1{flex:1}.inline{display:inline}.block{display:block}.hidden{display:none}
  .gap-1{gap:.25rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-x-3{column-gap:.75rem}.gap-y-0\.5{row-gap:.125rem}.space-y-2>*+*{margin-top:.5rem}.space-y-4>*+*{margin-top:1rem}
  .grid{display:grid}.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}.col-span-2{grid-column:span 2}
  @media(min-width:768px){.md\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.md\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.md\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.md\:grid-cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}.md\:grid-cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}.md\:grid-cols-7{grid-template-columns:repeat(7,minmax(0,1fr))}.md\:col-span-3{grid-column:span 3}.md\:col-span-5{grid-column:span 5}.md\:col-span-7{grid-column:span 7}}
  .max-w-6xl{max-width:72rem}.mx-auto{margin-left:auto;margin-right:auto}.px-3{padding-left:.75rem;padding-right:.75rem}.py-2{padding-top:.5rem;padding-bottom:.5rem}.py-4{padding-top:1rem;padding-bottom:1rem}.py-1{padding-top:.25rem;padding-bottom:.25rem}.pt-2{padding-top:.5rem}.pl-4{padding-left:1rem}
  .mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mb-1{margin-bottom:.25rem}.mb-2{margin-bottom:.5rem}
  .text-xs{font-size:.75rem}.text-sm{font-size:.875rem}.text-base{font-size:1rem}.text-lg{font-size:1.125rem}.text-2xl{font-size:1.5rem;line-height:2rem}.font-bold{font-weight:700}.font-semibold{font-weight:600}.font-medium{font-weight:500}.font-normal{font-weight:400}.font-mono{font-family:ui-monospace,monospace}
  .text-gray-500{color:#6b7280}.text-gray-600{color:#4b5563}.text-gray-400{color:#9ca3af}.text-green-700{color:#15803d}.text-red-700{color:#b91c1c}.text-amber-700{color:#b45309}.text-amber-800{color:#92400e}.text-indigo-700{color:#4338ca}.uppercase{text-transform:uppercase}.leading-tight{line-height:1.25}.underline{text-decoration:underline}.whitespace-pre-wrap{white-space:pre-wrap}.cursor-pointer{cursor:pointer}
  .bg-white{background:#fff}.bg-amber-50{background:#fffbeb}.bg-green-50{background:#f0fdf4}.border-b{border-bottom:1px solid #e5e7eb}.border-t{border-top:1px solid #e5e7eb}.border{border:1px solid #e5e7eb}.border-amber-200{border-color:#fde68a}.border-2{border-width:2px}.border-red-300{border-color:#fca5a5}.rounded{border-radius:.25rem}
  .sticky{position:sticky}.top-0{top:0}.z-10{z-index:10}.overflow-x-auto{overflow-x:auto}.min-h-screen{min-height:100vh}.h-24{height:6rem}.last\:border-0:last-child{border:0}
  .md h1,.md h2{font-weight:700;margin:.8rem 0 .3rem}.md h1{font-size:1.1rem}.md h2{font-size:1rem}.md ul{list-style:disc;padding-left:1.2rem}.md li{margin:.15rem 0}
</style>
</head>
<body class="min-h-screen">
<header class="bg-white border-b sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-3 py-2 flex items-center gap-3">
    <a href="/" class="font-bold text-indigo-700 text-lg">DealFinder</a>
    <nav class="flex gap-1 overflow-x-auto">
      {% set p = request.url.path %}
      <a href="/" class="{{ 'active' if p == '/' }}">Home</a>
      <a href="/deals" class="{{ 'active' if p.startswith('/deals') }}">Deals</a>
      <a href="/inventory" class="{{ 'active' if p.startswith('/inventory') }}">Stock</a>
      <a href="/pnl" class="{{ 'active' if p.startswith('/pnl') }}">P&amp;L</a>
      <a href="/projections" class="{{ 'active' if p.startswith('/projections') }}">Projections</a>
      <a href="/insights" class="{{ 'active' if p.startswith('/insights') }}">Tips</a>
      <a href="/health" class="{{ 'active' if p.startswith('/health') }}">Health</a>
      <a href="/settings" class="{{ 'active' if p.startswith('/settings') }}">Settings</a>
      <a href="/niches" class="{{ 'active' if p.startswith('/niches') }}">Niches</a>
      <a href="/sold-data" class="{{ 'active' if p.startswith('/sold-data') }}">Sold data</a>
    </nav>
  </div>
</header>
<main class="max-w-6xl mx-auto px-3 py-4 space-y-4">
{% block content %}{% endblock %}
</main>
</body>
</html>
