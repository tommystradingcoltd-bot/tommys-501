[project]
name = "dealfinder"
version = "0.1.0"
description = "Retro games deal finder and reseller system (niche-agnostic)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "anthropic>=0.40",
  "playwright>=1.40",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "rapidfuzz>=3.6",
  "reportlab>=4.0",
  "imagehash>=4.3",
  "pillow>=10.0",
  "python-dotenv>=1.0",
  "psycopg2-binary>=2.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
